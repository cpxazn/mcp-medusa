[project]
name = "mcp-medusa"
version = "0.1.0"
description = "MCP server for Medusa anime automation"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "httpx>=0.27.0",
    "fastmcp==3.4.7",
]

[project.scripts]
mcp-medusa = "mcp_medusa.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pyright>=1.1.410",
    "pytest>=9.1.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.17",
]
