name: CI

# Run the boot/integration test on every PR targeting main. This is the gate
# that proves the server actually starts (both stdio + sse) and registers the
# expected tools — it would have caught the fastmcp 3.x migration crashes.
# When the test passes, auto-merge is enabled so the PR merges with no human
# click (full-auto pipeline: test -> merge -> release -> build).

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  boot-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install package + test deps into the setup-uv venv
        run: |
          uv pip install -e ".[test]"

      - name: Run boot/integration tests
        run: uv run pytest tests/ -v

  enable-auto-merge:
    # Only auto-merge once the boot test is green.
    needs: boot-test
    if: github.event.pull_request.state == 'open'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Enable auto-merge (squash) on this PR
        env:
          # NOTE: GITHUB_TOKEN cannot merge PRs in this repo (GitHub limits
          # the Actions token's merge capability). A PAT with `repo` scope
          # must be stored as a repo secret named ACTIONS_PAT for this to work.
          GH_TOKEN: ${{ secrets.ACTIONS_PAT }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # boot-test (this job's dependency) already passed, so merge now.
          gh pr merge "$PR" --squash \
            --repo "${{ github.repository }}"
